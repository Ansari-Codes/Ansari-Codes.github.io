<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="50%" stop-color="#0D6A63" />
      <stop offset="100%" stop-color="#042F2E" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0F766E" stop-opacity="0.2" />
    </linearGradient>

    <!-- Mint Gradient for Percentage Nodes -->
    <linearGradient id="mintGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#99F6E4" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>

    <!-- Glow & Shadow -->
    <filter id="nodeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#021E1D" flood-opacity="0.5" />
    </filter>
    <filter id="arrowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#021E1D" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.75" />

  <!-- Subtle Radial Inner Glow -->
  <circle cx="32" cy="32" r="22" fill="#14B8A6" opacity="0.12" />

  <!-- Percentage / Growth Symbol -->
  <!-- Upper Left Node -->
  <g filter="url(#nodeShadow)">
    <circle cx="21" cy="21" r="5.5" fill="url(#mintGrad)" />
    <circle cx="21" cy="21" r="2.2" fill="#042F2E" />
  </g>

  <!-- Lower Right Node -->
  <g filter="url(#nodeShadow)">
    <circle cx="43" cy="43" r="5.5" fill="url(#mintGrad)" />
    <circle cx="43" cy="43" r="2.2" fill="#042F2E" />
  </g>

  <!-- Diagonal Ascending Growth Arrow (The % Slash) -->
  <g filter="url(#arrowShadow)">
    <!-- Shaft -->
    <path d="M19 45 L44 20" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
    <!-- Arrowhead -->
    <path d="M33 19 L45 19 L45 31" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
